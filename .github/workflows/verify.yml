name: Software verification

on:
  pull_request:
  push:
    branches:
      - main
      - codex/policy-kit-hardening
      - codex/consolidate-observatory-software

permissions:
  contents: read

concurrency:
  group: software-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete offline software checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - name: Install pinned software verification dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r config/ci/requirements.txt
      - name: Run complete synthetic verification and publication gate
        env:
          HARNESS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./scripts/verify_all.sh
